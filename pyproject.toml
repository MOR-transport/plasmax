[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plasma-sim"
version = "0.1.0"
description = "Jax semi-Lagrangian plasma simulation"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8.0",
    "scienceplots>=2.1.0",
    "PyYAML>=6.0",
    "flax>=0.12.7",
    "optax>=0.2.8",
    # NVIDIA GPU wheels are published for Linux only (see JAX docs). Elsewhere: CPU jaxlib.
    "jax[cuda12]>=0.4.28; sys_platform == 'linux'",
    "jax>=0.4.28; sys_platform != 'linux'",
    "tikzplotlib",
    "webcolors>=1.13",
    "equinox>=0.1.3",
    "scimba @ git+https://gitlab.com/scimba/scimba.git",
]

[project.optional-dependencies]
# Use on Linux if you have CUDA 13 + a new enough driver (see JAX installation docs).
cuda13 = ["jax[cuda13]>=0.4.28"]
test = ["pytest"]

[project.scripts]
plasmax-sim = "src.sim:simulate"
plasmax-optim = "src.adjoint_method:main"
plasmax-diags = "src.diagnostics.diags:main"
plasmax-segmented ="src.run_segmented:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]  

[tool.hatch.build.targets.wheel.force-include]
"params" = "params"

[tool.hatch.metadata]
allow-direct-references = true
