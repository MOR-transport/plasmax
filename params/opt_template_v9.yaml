method: predcorr # or nufi (not implemented in Python yet)
physics:
  charge: -1.0
  mass: 1.0
interp:
  order: 3
grid:
  nx: 512 # 2^7
  nv: 512
  #lx: 12.566370614359172 # 2*pi/k with k = 0.5
  lx: 31.41592653589793   # 2*pi/k with k = 0.2
  lv: 15.707963267948966  # 2*pi
time:
  nt_max: 4000
  dt: 0.1
  tend: 15
  plot_freq: 10
optim:
  target: two_stream
  eps: 0.05
  v0: 3
  k: 0.2
  # target: landau_damping
  # k: 0.5
  # alpha: 0.5
  # target: bump_on_tail
  # k: 0.5
  # eps: 0.5
  # vd: 3
  # vt: 0.2
  # nb: 0.1
  filter_xv: ones
  filter_t: gate_t
  lr: 1
  Nopt: 50